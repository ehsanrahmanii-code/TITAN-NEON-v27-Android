<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titan Neon v2.7</title>
<style>
body{font-family:sans-serif;background:#0b0f1a;color:#e8ecff;padding:24px;line-height:1.7}
.c{max-width:560px;margin:40px auto;background:#141a2e;border-radius:16px;padding:24px;border:1px solid #00f0ff44}
h1{color:#00f0ff;margin:0 0 12px}
.ok{color:#4ade80}
</style>
</head>
<body>
<div class="c">
<h1>Titan Neon v2.7 PRISM</h1>
<p class="ok">موتور در حال اجرا است.</p>
<p>نسخه: {{ version }}</p>
<p>داده در پوشه VVV ذخیره می‌شود.</p>
<p>برای نسخه کامل با همه تب‌ها و نمودارها، ماژول‌های باقی‌مانده در حال تکمیل است.</p>
</div>
<script>
fetch("/api/status").then(r=>r.json()).then(d=>{
  document.querySelector(".c").innerHTML += "<pre style=\"font-size:12px;opacity:.7\">"+JSON.stringify(d,null,2)+"</pre>";
}).catch(e=>{});
</script>
</body>
</html>
